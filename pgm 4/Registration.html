<html>
<head>
<title>Registration form</title>
<style>
body{
font-family:Arial;
}
form{
width:600px;
margin:30px auto;
padding:25px;
background-color:lightblue;
}
label{
display:inline-block;
width:180px;
margin8px;
}
textarea{
width:200px;
height:70px;}
</style>
</head>
<body>
<form>
<h3>Registration form</h3>
<label>fullname</label><input type="text"><br><br>
<label>mobile no</label><input type="text"><br><br>
<label>email id</label><input type="email"><br><br>
<label>age</label><input type="number"><br><br>
<label>gender</label><input type="radio" name="gender">
male<input type="radio" name="gender">
female<input type="radio" name="gender">
others<input type="radio" name="gender"><br>
<label>date of birth</label><input type="date">
<br><br>
<label>address </label><textarea rows="8" cols="30"></textarea>
<br><br>
<label>current study</label>
<select>
<option>B.tech</option>
<option>bca</option>
<option>mca</option>
</select>
<br><br>
<label>department</label>
<select>
<option>cs</option>
<option>ec</option>
<option>eee</option>
</select>
<br><br>
<label>upload cv</label>
<input type="file">
<br><br>
<label>programming languages</label>
<input type="checkbox">html
<input type="checkbox">css
<input type="checkbox">flutter
<br><br>
<label>language</label>
<input type="checkbox">english
<input type="checkbox">malayalam
<input type="checkbox">hindi<br><br>
<input type="submit" value="submit"><br><br>
<input type="reset" value="reset"><br>
</form>
</body>
</html>
